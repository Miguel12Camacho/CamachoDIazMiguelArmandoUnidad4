name: tienda-digital

x-app: &app
  build: .
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment: &app-env
    NODE_ENV: production
    PORT: 3000
    APP_URL: https://${DOMAIN:-localhost}
    SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET en el archivo .env}
    DB_HOST: db
    DB_PORT: 5432
    DB_NAME: ${DB_NAME:-tienda_digital}
    DB_USER: ${DB_USER:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    REPO_URL: ${REPO_URL:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    SMTP_FROM: ${SMTP_FROM:-}
  networks:
    - backend

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tienda_digital}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-1

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-2

  app3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-3

  balanceador:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app1
      - app2
      - app3
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      NGINX_ENVSUBST_FILTER: DOMAIN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
      - acme-challenge:/var/www/certbot
    networks:
      - backend

volumes:
  db-data:
  acme-challenge:

networks:
  backend:
